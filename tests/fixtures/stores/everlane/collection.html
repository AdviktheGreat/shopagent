<!doctype html>
<html lang="en">
  <head>
    <title>Women's Tops | Everlane</title>
    <meta property="og:site_name" content="Everlane" />
  </head>
  <body>
    <header>
      <button class="localization-form__select">
        <span class="thread-link">US/USD</span></button
      ><a href="/products/not-a-card">Navigation only</a>
    </header>
    <main id="MainContent">
      <h1>Women's Tops</h1>
      <div class="blm-product-search__results">
        <!-- Reduced observed card structure; title, image, and price are siblings. -->
        <div class="blm-product-search__result js-product-item">
          <div class="blm-product-search-image-wrapper">
            <a
              class="blm-product-search-image-container"
              href="https://www.everlane.com/products/womens-flannel-shirt-dark-chocolate?utm_source=fixture"
              ><img
                class="js-product-image"
                alt="Flannel Shirt"
                src="https://cdn.shopify.com/s/files/1/0623/7916/3734/files/9eddc66d_c8c6_700x.jpg?v=1758302335"
            /></a>
          </div>
          <div class="blm-product-search-details-container">
            <a
              class="js-product-title"
              href="/products/womens-flannel-shirt-dark-chocolate"
              >Flannel Shirt</a
            >
            <p class="blm-product-search-details-container__price">
              <span class="js-product-price">$98.00</span>
            </p>
          </div>
        </div>
        <!-- Synthetic sale and hidden-card edge cases; not live inventory. -->
        <div class="blm-product-search__result js-product-item">
          <a href="/products/synthetic-sale-shirt"
            ><img alt="Sale shirt fixture" src="/fixture-shirt.jpg" /></a
          ><a class="js-product-title" href="/products/synthetic-sale-shirt"
            >Sale shirt fixture</a
          >
          <p><s>$120.00</s><span class="js-product-price">$79.00</span></p>
        </div>
        <div class="blm-product-search__result js-product-item" hidden>
          <a href="/products/hidden"
            ><img alt="Hidden product" src="/hidden.jpg" /></a
          ><a class="js-product-title" href="/products/hidden">Hidden product</a
          ><span class="js-product-price">$1.00</span>
        </div>
      </div>
    </main>
  </body>
</html>
